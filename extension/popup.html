<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS AI Operator</title>
  <style>
    :root {
      --bg: #0b0d19;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      overflow-x: hidden;
    }

    /* Container Glass effect */
    .app-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .context-panel {
      font-size: 12px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid var(--glass-border);
    }

    .context-title {
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .context-val {
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    textarea, input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 13px;
      transition: all 0.2s ease;
    }

    textarea:focus, input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    textarea {
      resize: none;
      height: 64px;
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      border-radius: 8px;
      padding: 10px;
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .result-panel {
      margin-top: 16px;
      font-size: 12px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      display: none;
    }

    .result-success {
      border-color: rgba(16, 185, 129, 0.3);
    }

    .result-error {
      border-color: rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="app-card">
    <div class="header">
      <h1>NEXUS AI</h1>
      <span class="status-badge" id="conn-status">Connected</span>
    </div>

    <div class="context-panel">
      <div class="context-title">Browser Context</div>
      <div class="context-val" id="page-title">Loading tab context...</div>
      <div class="context-val" id="page-url" style="font-size: 10px;"></div>
    </div>

    <div class="input-group">
      <label for="jwt-token">Backend Token (Optional)</label>
      <input type="password" id="jwt-token" placeholder="Enter JWT auth token">
    </div>

    <div class="input-group">
      <label for="operator-command">Digital Command</label>
      <textarea id="operator-command" placeholder="e.g. send email to test@gmail.com saying hi"></textarea>
    </div>

    <button id="run-btn">Execute Task</button>

    <div class="result-panel" id="result-box"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
